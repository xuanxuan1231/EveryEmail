# git-cliff configuration for GitHub Release notes.

[changelog]
header = """
# Changelog

"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## 未发布 - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}
{% endfor %}
"""
trim = true
footer = """

<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
topo_order = false

commit_parsers = [
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能" },
  { message = "^refactor", group = "重构" },
  { message = "^docs?", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^build", group = "构建" },
  { message = "^ci", group = "CI" },
  { message = "^style", group = "样式" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "维护" },
  { message = "^revert", group = "回滚" },
  { message = ".*", group = "其他" },
]
